# softwareco/contrib in System4D terms.
# The SoftwareCo contrib lane root: it tracks only the lane's control-plane files and the automation that keeps the upstream checkouts below it fresh; each checkout is its own git repo.
# Written for the agents that work in and beside this repo: read it before changing what the repo does or how.
# README.md, AGENTS.md and docs/project/ hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "SoftwareCo contrib lane root"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "The lane's control-plane files: AGENTS.md, governance/, ontology/, scripts/, docs/, diary/ and justfile (.gitignore tracks only these)"
          - "The hourly sync of every first-level checkout (scripts/pull-all-local-contrib-repos.sh, run by scripts/systemd/contrib-all-repos-pull.timer; cron fallback in scripts/cron/): release-first by default, per-repo contrib.syncMode branch|release"
          - "The pi-mono compatibility relay: detect upstream pi-mono movement under watched paths and dispatch the pi-extensions compatibility canary (scripts/pi-mono-compatibility-relay.sh)"
          - "The evidence index over relay receipts (scripts/pi-mono-compatibility-evidence-index.mjs -> .state/pi-mono-compatibility-relay/evidence-index.json)"
          - "Lane learnings, diaries and adjudications about contrib work (docs/learnings/, docs/project/)"
        out_of_scope:
          - "The upstream checkouts themselves (about 260 clones plus linked worktrees): separate git repos with their own origins, ignored here"
          - "Upstream contribution branches and PRs: done inside each checkout (softwareco-contrib-upstream skill)"
          - "The compatibility canary contract, scenarios and workflow: owned/pi-extensions owns them (docs/project/pi-mono-compatibility-relay.md)"
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it; governance/task-scopes/ snapshots are frozen exports"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
      constraints:
        - "Mainline development: commit to main and push to main; docs/_core/** is immutable"
        - "The lane root git repo has no remote configured"
        - "The sync service runs sandboxed: it may write only the contrib tree (repos, .locks, .logs, .state) and reaches GitHub over https (scripts/systemd/contrib-all-repos-pull.service.d/hardening.conf)"
        - "Sync tests run offline: isolated HOME and git config, disposable repos and worktrees, file-only Git transport and fake GitHub responses (docs/project/contrib-sync-worktree-safety.md)"
      edges:
        - name: "Upstream sync"
          direction: "in"
          protocol: "https"
          system: "GitHub origins and upstream remotes of the contrib checkouts; gh for the latest stable release"
          contract: "scripts/pull-all-local-contrib-repos.sh --help; docs/project/contrib-sync-worktree-safety.md"
        - name: "Compatibility canary dispatch"
          direction: "out"
          protocol: "cli"
          system: "softwareco/owned/pi-extensions: gh workflow run compatibility-canary.yml (mode workflow) or its local runner (mode local)"
          contract: "docs/project/pi-mono-compatibility-relay.md"
        - name: "Relay evidence"
          direction: "out"
          protocol: "file"
          system: "Agents and operators querying compatibility risk"
          contract: "docs/project/pi-mono-compatibility-evidence-index.md (.logs/pi-mono-compatibility-relay/ receipts, .state/ index)"
        - name: "Scanner service worktree"
          direction: "out"
          protocol: "file"
          system: "softwareco/scripts/ubs-staged.sh pre-commit hooks, which run ultimate_bug_scanner-local and fall back to the mirror checkout with a notice"
          contract: "docs/project/2026-09-25-contrib-fork-service-branch-many-of-the-greats.md (AK 5919)"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this lane live in AK, not in markdown (governance/README.md)"
        - name: "core/ontology-kernel and softwareco/ontology"
          type: "build"
          note: "The core and company ontology layers, pinned in ontology/manifest.yaml as <repo:core/ontology-kernel@main> and <repo:softwareco/ontology@main>"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which resolves ROCS_BIN, the workspace core/rocs-cli checkout, or rocs on PATH"
        - name: "git, gh, flock and node"
          type: "runtime"
          note: "git and gh for fetch, release lookup, credential helper and workflow dispatch; flock for the run lock; node for the evidence index"
        - name: "systemd user timer"
          type: "infra"
          note: "contrib-all-repos-pull.timer runs the sync hourly with up to 20 minutes of random delay"
      anti_goals:
        - "A fork-local sync mode: a checkout that must run a fork branch moves the service into a linked worktree instead (AK 5919 adjudication)"
        - "Moving the compatibility canary out of pi-extensions; contrib owns only the upstream trigger"
        - "Tracking a child checkout's files in the lane root"
    compass:
      drivers:
        - "About 260 upstream checkouts, some on feature branches with live work, must stay fresh without a manual pull moving that work (diary/2026-09-06--ops-contrib-pull-hygiene.md)"
        - "Without the relay, contrib updates and downstream extension compatibility drift into disconnected manual memory (docs/project/pi-mono-compatibility-relay.md)"
      outcomes:
        - "Every clean primary checkout follows its latest stable release or default branch without touching local work"
        - "Upstream Pi changes that can affect our extensions trigger the pi-extensions canary and leave a queryable evidence trail"
      tradeoffs:
        - decision: "How a checkout runs a fork branch while the timer keeps it fresh"
          chosen: "The mirror stays in the primary checkout and the service branch lives in a linked worktree the sync skips"
          because: "Structure needs no cooperation from other automation and needs no script change (docs/project/2026-09-25-contrib-fork-service-branch-many-of-the-greats.md)"
        - decision: "What the sync checks out by default"
          chosen: "The latest stable GitHub release of origin, detached; contrib.syncMode branch opts a repo into origin's default branch"
          because: "scripts/pull-all-local-contrib-repos.sh usage"
        - decision: "Who owns compatibility checks"
          chosen: "contrib owns detection, relay state and receipts; pi-extensions owns the canary"
          because: "The split is deliberate (docs/project/pi-mono-compatibility-relay.md)"
    engine:
      triggers:
        - "contrib-all-repos-pull.timer (hourly, OnBootSec=10m) or a manual run of scripts/pull-all-local-contrib-repos.sh"
        - "The sync finishing, which invokes the pi-mono relay"
      states:
        - name: "OK / WARN / FAIL / SKIP / DRYRUN"
          meaning: "Per-checkout result of a sync run in .logs/github-sync/ (for example WARN default=main:blocked-dirty, SKIP linked worktree)"
        - name: "workflow / local / off"
          meaning: "Relay mode: dispatch the GitHub workflow, run the local canary, or detect only"
      invariants:
        - id: "CTR-INV-001"
          statement: "The sync skips linked worktrees before any fetch, release lookup, checkout or merge; unreadable Git topology yields FAIL with no mutation"
          enforcement: "test: scripts/pull-all-local-contrib-repos.sh, scripts/test-pull-all-local-contrib-repos.sh"
        - id: "CTR-INV-002"
          statement: "The sync moves HEAD only in a clean worktree and only fast-forwards a branch; a dirty or diverged checkout is reported, not changed"
          enforcement: "test: scripts/test-pull-all-local-contrib-repos.sh (clean, dirty, detached, diverged cases)"
        - id: "CTR-INV-003"
          statement: "An invalid, empty or duplicated contrib.syncMode fails closed"
          enforcement: "test: scripts/test-pull-all-local-contrib-repos.sh"
        - id: "CTR-INV-004"
          statement: "Only one sync runs at a time"
          enforcement: "test: flock -n on .locks/git-pull-all.lock in scripts/pull-all-local-contrib-repos.sh"
        - id: "CTR-INV-005"
          statement: "The sync recognises gh's URL-scoped credential helper and does not rewrite ~/.gitconfig on every run"
          enforcement: "test: scripts/test-pull-all-credential-helper.sh (AK 5930)"
        - id: "CTR-INV-006"
          statement: "The relay dispatches the canary only when watched paths (packages/coding-agent, packages/tui) changed since the last processed pi-mono HEAD, and writes a receipt"
          enforcement: "test: scripts/test-pi-mono-compatibility-relay.sh, run by scripts/ci/full.sh"
      lifecycle:
        - "Take the run lock and set up gh authentication and logging"
        - "For each first-level checkout in parallel: skip linked worktrees, fetch, then check out the release or fast-forward the default branch when clean"
        - "Run the pi-mono relay: compare HEAD with .state, dispatch the canary if watched paths moved, write the receipt"
        - "Rebuild the evidence index"
    fog:
      assumptions:
        - id: "CTR-A-001"
          statement: "In workflow mode, compatibility-canary.yml exists on the target pi-extensions remote branch"
          how_to_validate: "gh workflow list in softwareco/owned/pi-extensions; dispatch status in the relay receipt"
      risks:
        - id: "CTR-R-001"
          statement: "A clean checkout that carries newer committed local work is replaced by an origin release (pi-sub-maintained reverted to v1.5.0, 2026-09-05 and 09-07); clean does not mean disposable"
          mitigation: "CTR-INV-001; keep maintained or fork branches in linked worktrees (docs/project/contrib-sync-worktree-safety.md)"
        - id: "CTR-R-002"
          statement: "Skipping a linked worktree is not a write lock: a primary clone still fetches shared remote refs and tags"
          mitigation: "Fetch refspecs stay ordinary remote-tracking mappings; any change to them needs its own work-product inspection (docs/project/contrib-sync-worktree-safety.md)"
        - id: "CTR-R-003"
          statement: "Whole-script --dry-run still performs authentication setup, logging and locking, so it is not a side-effect-free probe of a live root"
          mitigation: "Test the worker guard with scripts/test-pull-all-local-contrib-repos.sh, not a dry run on the live tree"
        - id: "CTR-R-004"
          statement: "Deleting the ultimate_bug_scanner-local worktree by hand makes every pre-commit hook fall back to the upstream mirror"
          mitigation: "ubs-staged.sh names the fallback in a one-line notice; UBS_BIN overrides both"
      exceptions:
        - id: "CTR-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "CTR-D-001"
          statement: "The root still carries tpl-project-repo text: AGENTS.md says 'Template for a delivery project repo', README.md describes a project repo, and docs/project purpose, vision and mission are 'TBD'"
          payoff_plan: "None recorded; rewrite them for the lane root under an AK task"
        - id: "CTR-D-002"
          statement: "./scripts/rocs.sh does not set ROCS_WORKSPACE_ROOT, so validate --resolve-refs fails with 'local ref not available in workspace' unless the caller exports it"
          payoff_plan: "None recorded; the softwareco/infra and healthco launchers default it to ~/ai-society"
        - id: "CTR-D-003"
          statement: "justfile pull-all is a second, older pull path: git pull --ff-only in clean first-level clones, without the run lock, release policy, contrib.syncMode or relay"
          payoff_plan: "None recorded"
