# 2026-09-06: sandbox the hourly contrib pull. It only needs to write the contrib tree (repos, .locks,
# .logs, .state), read git/gh config and reach GitHub over https; gh's token comes via the D-Bus keyring.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/tryinget/ai-society/softwareco/contrib
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=
# TMPDIR from the user manager points into ~/.local/state, which is read-only here; PrivateTmp gives a private /tmp.
Environment=TMPDIR=/tmp
