# softwareco/infra in System4D terms.
# The SoftwareCo infra lane root: lane-level policy, the infra repo capability map and cross-repo infra ownership decisions; each infra repo below it is its own git repo.
# Written for the agents that work in and beside this repo: read it before changing what the repo does or how.
# README.md, AGENTS.md and docs/project/ hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "SoftwareCo infra lane root"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Group-level AGENTS.md defaults for infrastructure and platform repos: parent context injected into every infra repo's prompt"
          - "The infra repo capability map (docs/project/repo-capability-map.md): which infra repo owns what, its trigger cues and read-first docs"
          - "Cross-repo infra ownership decisions with their RFC, inspection findings and evidence, for example the AK build-provenance owner selection (docs/decisions/2026-09-01-softwareco-build-provenance-owner.md, AK Decision 148)"
          - "Owner-local rollout projections across infra repos (docs/project/2026-09-27-engineering-core-v0.12.0-batch-2-retry.md)"
          - "The lane's control-plane files (.gitignore tracks only these), plus the issue-tracker child recorded as a gitlink"
        out_of_scope:
          - "The infra repos themselves (workstation, provisioning, ds1621-admin, issue-tracker, replay-fabric, ts-quality-tools, obsidian-vault-ops and others): separate git repos with their own AGENTS.md"
          - "The AI Society Runtime Cell concept and intent: holdingco/infra owns it; this lane owns the concrete implementation below it (repo-capability-map.md)"
          - "Each infra repo's engineering-core pin, local overrides, checks and landing: the repo owns them"
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it; governance/task-scopes/ snapshots are frozen exports"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
      constraints:
        - "Main-first: commit directly to main for normal work; GitHub PRs for releases or when the operator asks for one (AGENTS.md)"
        - "Keep AGENTS.md concise, meta-level and infrastructure-archetype focused, because every descendant prompt includes it"
        - "docs/_core/** is immutable; no secrets in git"
        - "The lane root git repo has no remote configured"
      edges:
        - name: "Child infra repos"
          direction: "out"
          protocol: "file"
          system: "Infra repos under this directory"
          contract: "AGENTS.md (parent context); docs/project/repo-capability-map.md (ownership and read-first docs)"
        - name: "issue-tracker gitlink"
          direction: "in"
          protocol: "git"
          system: "softwareco/infra/issue-tracker"
          contract: ".gitignore promotes issue-tracker/ into lane visibility; the root advances the gitlink by explicit commit after the child is pushed (commit f5bbf80)"
        - name: "Runtime Cell intent"
          direction: "in"
          protocol: "file"
          system: "holdingco/infra"
          contract: "holdingco/infra/docs/project/ai-society-runtime-cell-problem-intent.md"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this lane live in AK, not in markdown (governance/README.md)"
        - name: "core/ontology-kernel and softwareco"
          type: "build"
          note: "The core and company ontology layers, pinned in ontology/manifest.yaml as <repo:core/ontology-kernel@v0.2.0> and <repo:softwareco@main>"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which resolves ROCS_BIN, the workspace core/rocs-cli checkout, or rocs on PATH, with ROCS_WORKSPACE_ROOT defaulting to ~/ai-society"
      anti_goals:
        - "Repo-specific operational detail in the lane AGENTS.md"
        - "Expanding the capability map beyond its seeded scope before routing pressure is real"
        - "A rollout projection that acts as a second task ledger or advances a repo's status on its own"
        - "A checked-in work-items projection: AK is the sole work authority (governance/README.md)"
    compass:
      drivers:
        - "Infra work arrives from arbitrary working directories and must reach the one infra repo that owns it (repo-capability-map.md Use)"
        - "Some infra concerns span repos and need an accountable owner chosen at the lane level, such as independent AK build provenance (Decision 148)"
      outcomes:
        - "From any working directory an agent picks the right infra repo and reads only its minimal read-first docs"
        - "Cross-repo ownership is decided once at the root, with an RFC, an independent inspection and evidence, and implementation stays in the owning repo"
      tradeoffs:
        - decision: "Who owns independent AK build provenance"
          chosen: "infra/workstation as accountable future owner; the lane root keeps owner-selection and transfer decisions; agent-kernel only measures and verifies"
          because: "Owner selection only, with implementation separately gated (docs/decisions/2026-09-01-softwareco-build-provenance-owner.md)"
        - decision: "How a fleet rollout reaches infra repos"
          chosen: "One repo at a time under an exact owner task; skip or block rather than collide with live sessions"
          because: "Three repos were skipped for live sessions and dirty trees in AK 6051 (docs/project/2026-09-27-engineering-core-v0.12.0-batch-2-retry.md)"
        - decision: "Which child repos the root tracks"
          chosen: "None by default; issue-tracker alone is promoted, as a gitlink"
          because: ".gitignore: so the tracker migration repo can be packaged and committed"
    engine:
      triggers:
        - "An agent must route infra work from an arbitrary working directory"
        - "A concern spans infra repos and needs an owner decision"
        - "A fleet rollout or the issue-tracker child moves forward"
      states: []
      invariants:
        - id: "INF-INV-001"
          statement: "No change touches docs/_core/**"
          enforcement: "test: scripts/ci/smoke.sh rejects a diff against the base branch that touches docs/_core"
        - id: "INF-INV-002"
          statement: "The ontology layers resolve and pass rocs build and validate"
          enforcement: "test: scripts/ci/full.sh runs ./scripts/rocs.sh build and validate --resolve-refs (workspace root ~/ai-society, loose by default)"
        - id: "INF-INV-003"
          statement: "Routing trusts an operator-named repo first, matches trigger cues conservatively, reads only the top candidate's read-first docs, and widens only when that repo clearly fails to own the concern"
          enforcement: "policy: docs/project/repo-capability-map.md Routing rule"
        - id: "INF-INV-004"
          statement: "A rollout projection never advances a repo's status; AK task results and evidence hold the disposition"
          enforcement: "policy: docs/project/2026-09-27-engineering-core-v0.12.0-batch-2-retry.md"
      lifecycle:
        - "Take the exact repo the operator names, or match the capability map's trigger cues"
        - "Read the top candidate's read-first docs and work inside that repo"
        - "Bring cross-repo ownership questions back to the root as RFC, independent inspection and AK decision"
    fog:
      assumptions:
        - id: "INF-A-001"
          statement: "The seeded capability map covers the infra repos agents actually need; home-network and pilot-infra-strict-l2-20260212 are not on it"
          how_to_validate: "Compare docs/project/repo-capability-map.md with the child repos in this directory when routing misses"
      risks:
        - id: "INF-R-001"
          statement: "Text added to the lane AGENTS.md lands in every infra repo's prompt, so lane bloat or repo-specific detail reaches repos it does not fit"
          mitigation: "Keep repo-specific operations in each infra repo's AGENTS.md (AGENTS.md First-principles boundary)"
        - id: "INF-R-002"
          statement: "The issue-tracker gitlink lags the child repo's HEAD, so the root records a stale tracker commit"
          mitigation: "Advance the gitlink by explicit commit once the child commit is pushed (commit f5bbf80)"
      exceptions:
        - id: "INF-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "INF-D-001"
          statement: "The root still carries tpl-project-repo text: README.md describes a project repo, and docs/project purpose, vision and mission are 'TBD'"
          payoff_plan: "None recorded; rewrite them for the lane root under an AK task"
        - id: "INF-D-002"
          statement: "governance/README.md says to verify snapshots with ./scripts/check-task-scope-snapshots.sh, which the repo does not contain"
          payoff_plan: "None recorded"
        - id: "INF-D-003"
          statement: ".copier-answers.yml names core/ontology-kernel v0.2.1 (commit 94488ee), while ontology/manifest.yaml still pins v0.2.0"
          payoff_plan: "None recorded"
