# softwareco/owned in System4D terms.
# The lane-root control-plane repo above the softwareco/owned child repos, which are separate, gitignored git repos.
# Written for the agents that work in and beside this repo: read it before
# changing what the repo does or how. README.md, AGENTS.md and docs/project/
# hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "softwareco/owned lane root"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Lane-level operating context that every child repo inherits: AGENTS.md guardrails, the default read order, and the standardized Justfile contract (docs/project/standardized-justfile-contract.md)"
          - "Routing a task to the owning child repo: docs/project/repo-capability-map.md, a conservative selection surface, not capability truth"
          - "Deterministic lane helpers: scripts/preflight-repo-census.sh (branch and dirty state of every child repo), scripts/rocs.sh, scripts/check-task-scope-snapshots.sh"
          - "The lane's engineering-core adoption view: scripts/engineering-core-adoption-scan.sh writes governance/engineering-core-adoption-scan.json and docs/project/engineering-core-adoption-dashboard.md"
          - "The legacy Ghostty AK task launcher (scripts/launch-pi-ak-task-ghostty.sh), kept as a refusing compatibility surface under Decision 151, with synthetic tests in tests/"
          - "Lane-root decisions (docs/decisions/), diary capture and the next_session_prompt.md handoff for this repo itself"
        out_of_scope:
          - "Implementation in a child repo: each child under softwareco/owned is its own git repo and owns its code, planning and AK tasks (ADR 0001, docs/decisions/2026-03-17-lane-root-control-plane.md)"
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it; governance/task-scopes/ snapshots are frozen AK exports, and the retired governance/work-items.json projection stays retired (governance/README.md)"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the lane root defines none of its own"
          - "Adoption scanner semantics: core/engineering-core owns them; this root owns only its snapshot, dashboard and follow-up waves (docs/project/vision.md)"
          - "Visible task-session authority: the accepted ADR and implementation live in pi-extensions; the launcher here only refuses or defers to their outside-domain classification (docs/project/ghostty-ak-task-launcher.md)"
      constraints:
        - "Primary language per .copier-answers.yml: python (helper libs and tests); most helpers are POSIX sh or bash"
        - "Only lane-root files are tracked: .gitignore ignores everything and allow-lists the lane-root files (AGENTS.md, README.md, docs/, governance/, ontology/, scripts/, tests/, tools/ and a few root files)"
        - "AGENTS.md is concatenated into every descendant repo's context, so it stays short and lane-level; repo-specific rules go in the child repo's AGENTS.md"
        - "just check is the bounded local check: shell/Python syntax, scoped whitespace and the synthetic launcher tests, with no live AK, Pi, Ghostty or provider calls; tests need an owned TMPDIR and refuse a /tmp fallback (scripts/just-task-session-check.sh)"
        - "just ci exits 2 on purpose: scripts/ci/smoke.sh and fast.sh can fetch Git remotes and full.sh reaches AK, task scopes and ROCS, so those profiles need separate authorization (README.md: Validation)"
      edges:
        - name: "Lane context for child repos"
          direction: "out"
          protocol: "file"
          system: "Child repos under softwareco/owned, whose harnesses concatenate parent AGENTS.md files"
          contract: "AGENTS.md; docs/project/standardized-justfile-contract.md"
        - name: "Repo census"
          direction: "in"
          protocol: "cli"
          system: "The child git repos under the lane"
          contract: "scripts/preflight-repo-census.sh, scripts/lib/repo-surface.sh"
        - name: "Engineering-core adoption scan"
          direction: "in"
          protocol: "cli"
          system: "core/engineering-core scan-adoption, run through uv"
          contract: "docs/project/engineering-core-adoption-scanner.md"
        - name: "Task-scope snapshots"
          direction: "in"
          protocol: "cli"
          system: "Agent Kernel (ak task scope export)"
          contract: "governance/README.md; scripts/check-task-scope-snapshots.sh"
        - name: "Legacy task launch"
          direction: "out"
          protocol: "cli"
          system: "AK, Ghostty, Pi and niri focus, reached only after a positive outside-domain classification"
          contract: "docs/project/ghostty-ak-task-launcher.md; docs/project/2026-09-07-visible-task-session-lane-implementation.md"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this repo live in AK, not in markdown"
        - name: "core/ontology-kernel and softwareco/ontology"
          type: "build"
          note: "The core and company ontology layers, pinned in ontology/manifest.yaml"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which prefers the vendored copy in tools/rocs-cli (0.1.4, VENDORED_HASHES.json)"
        - name: "core/engineering-core"
          type: "build"
          note: "scripts/engineering-core-adoption-scan.sh runs its scan-adoption CLI from ../../core/engineering-core, or from ENGINEERING_CORE_ROOT"
      anti_goals:
        - "Treating the lane root as a product repo, or mirroring child-repo task state here (ADR 0001)"
        - "Bringing back a checked-in governance/work-items.json projection (governance/README.md)"
        - "A passing just ci alias that hides the runtime-bearing CI profiles (README.md: Validation)"
        - "A lane registry, per-task partial launch or caller opt-out for the legacy launcher (docs/project/ghostty-ak-task-launcher.md)"
        - "Template re-renders that overwrite lane-root semantics before anyone has read the diff (README.md)"
    compass:
      drivers:
        - "Operators and agents entering softwareco/owned must find the owning child repo quickly; stale lane-root docs send them to the wrong one (docs/system4d/compass.md, fog.md)"
        - "The lane needs one view of engineering-core adoption across its child repos without owning the scanner (docs/project/vision.md)"
      outcomes:
        - "A new operator can enter softwareco/owned, understand the lane boundary, find the right child repo, run the deterministic preflight checks, read adoption coverage and choose the next lane-root action in one session (docs/project/vision.md)"
      tradeoffs:
        - decision: "Lane root as a product repo or as a control plane"
          chosen: "Control plane: lane-root docs, wrappers, ontology and census only; child repos own implementation"
          because: "The template scaffold read like a single-project repo, which made it easy to misplace work or duplicate child-repo state (ADR 0001)"
        - decision: "Where the adoption scanner lives"
          chosen: "A thin wrapper here over core/engineering-core's scan-adoption"
          because: "core/engineering-core owns reusable scanner semantics; the lane root owns its snapshot and dashboard (docs/project/engineering-core-adoption-scanner.md)"
        - decision: "What the legacy launcher does without a positive classification"
          chosen: "Refuse the whole request before mkdir, AK, terminal or focus, including batches, presets and --dry-run"
          because: "Decision 151 withdrew affected-domain support, and missing classification never enables a fallback (docs/project/ghostty-ak-task-launcher.md)"
    engine:
      triggers:
        - "An operator or agent starts a session at the lane root"
        - "A task must be routed to an owned child repo from a vague cue or another working directory"
        - "An engineering-core release wave needs the lane's adoption coverage refreshed"
        - "Someone runs a legacy Ghostty launch recipe, alias or preset"
      states:
        - name: "dirty (census)"
          meaning: "A child repo has uncommitted changes; the census DIRTY column shows it"
        - name: "refused (launcher)"
          meaning: "A launch request has an affected, unknown or unclassified member; nothing is created and AK, Ghostty and focus are not touched"
        - name: "outside-domain verified (launcher)"
          meaning: "The DB-free identity / classify-installed consumer returned a typed, version- and digest-bound outside result; only then does the legacy body run"
      invariants:
        - id: "OWN-INV-001"
          statement: "The lane root tracks only lane-root files; child repos stay separate, gitignored git repos"
          enforcement: "policy: .gitignore (deny-all plus an allow-list of lane-root paths), ADR 0001"
        - id: "OWN-INV-002"
          statement: "The legacy launcher refuses the whole expanded request before any effect unless every member is positively classified outside the affected domains, and runtime overrides do not bypass the classification"
          enforcement: "test: scripts/launch-pi-ak-task-ghostty.sh, tests/test_ghostty_task_session.py and its sibling task_session tests (just test)"
        - id: "OWN-INV-003"
          statement: "Lane tests run without live AK, Pi, Ghostty or provider calls and only under an owned TMPDIR"
          enforcement: "test: scripts/just-task-session-check.sh (test, doctor)"
        - id: "OWN-INV-004"
          statement: "Every checked-in governance/task-scopes/AK-*.snapshot.json matches its ak task scope export"
          enforcement: "test: scripts/check-task-scope-snapshots.sh, called by scripts/ci/full.sh"
      lifecycle:
        - "Read next_session_prompt.md and this repo's AK tasks"
        - "Run ./scripts/preflight-repo-census.sh . to see each child repo's branch and dirty state"
        - "Route child-repo work through docs/project/repo-capability-map.md and continue in that repo under its own AGENTS.md"
        - "Keep lane-root work to one bounded slice and check it with just check"
        - "After an engineering-core wave, refresh the snapshot with ./scripts/engineering-core-adoption-scan.sh --include-packages --write"
    fog:
      assumptions:
        - id: "OWN-A-001"
          statement: "The capability map still names the right owner for each concern"
          how_to_validate: "Confirm in the selected child repo's AGENTS.md and README.md before implementing (docs/project/repo-capability-map.md calls the map a hint)"
        - id: "OWN-A-002"
          statement: "ROCS resolves the core and company layer refs (repo:core/ontology-kernel@main, repo:softwareco/ontology@main) from local checkouts"
          how_to_validate: "ROCS_WORKSPACE_ROOT=$HOME/ai-society ./scripts/rocs.sh validate --repo . --resolve-refs; without ROCS_WORKSPACE_ROOT the vendored rocs-cli stops with 'local ref not available in workspace'"
      risks:
        - id: "OWN-R-001"
          statement: "Stale lane-root docs send operators into the wrong repo"
          mitigation: "Treat the capability map as a hint and confirm in the child repo; keep README.md and next_session_prompt.md current"
        - id: "OWN-R-002"
          statement: "Dirty child repos give false confidence when census output is ignored"
          mitigation: "Run the census at session start and read its DIRTY column"
        - id: "OWN-R-003"
          statement: "A brownfield template re-render overwrites lane-root semantics"
          mitigation: "Read the render diff before accepting it; contracts/layer-contract.yml forbids L2 to L1 transitions and nested copier tasks"
        - id: "OWN-R-004"
          statement: "Copied launcher recipes and private aliases run outside the checked-in launcher, which cannot certify or intercept them"
          mitigation: "Positive owner withdrawal of support for copied recipes (README.md)"
      exceptions:
        - id: "OWN-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "OWN-D-001"
          statement: "README.md, docs/project/model.md, docs/system4d/engine.md and next_session_prompt.md still send operators to the retired governance/work-items.json and ak work-items check"
          payoff_plan: "No AK task names it yet; rewrite them to the AK-only flow in governance/README.md when the lane root is next touched"
        - id: "OWN-D-002"
          statement: "Full repository validation is not certified: just check covers only the launcher slice, and scripts/ci/full.sh calls the old ./scripts/rocs.sh launcher without ROCS_WORKSPACE_ROOT, so the vendored rocs-cli 0.1.4 fails on the layer refs"
          payoff_plan: "AK 6517 re-vendors rocs-cli 0.4.6 into this root; the ci profiles stay separately authorized (README.md: Validation)"
