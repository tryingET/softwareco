stages:
  - test

core_integrity_check:
  stage: test
  image: alpine:3.19
  script:
    - apk add --no-cache git ripgrep
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - |
      git diff --name-only "origin/$CI_DEFAULT_BRANCH"...HEAD \
        | rg -n '^(docs/_core($|/))' \
        && { echo "error: protected core paths modified"; exit 1; } \
        || echo "ok: no protected core changes"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

