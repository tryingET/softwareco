stages:
  - validate

rocs:validate:
  stage: validate
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  rules:
    - when: always
  script:
    - python --version
    - uv --version
    - bash scripts/rocs.sh --doctor
    - bash scripts/rocs.sh --which
    - bash scripts/rocs.sh version
    - ROCS_CI_PROFILE=main-strict bash scripts/ci/full.sh
  artifacts:
    when: always
    paths:
      - dist/
