ontology:
  system4d:
    name: "Software Company Overlay"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Domain semantics and invariants for softwareco"
          - "SoftwareCo repo topology (owned vs contrib lanes)"
        out_of_scope:
          - "Enterprise-wide standardization of all teams (solo dev)"
          - "Forcing standards on contrib lane repos by default"
      constraints:
        - "Prefer boring tech; document trade-offs; keep interfaces explicit."
        - "All production changes require CI validation."
        - "GitLab layout: ai-society/softwareco/owned/* (we own); ai-society/softwareco/contrib/<upstream>/<repo> (we contribute)."
      edges:
        - name: "<DomainIntegration>"
          direction: "bi"
          protocol: "<http|kafka|file>"
          system: "<external system>"
          contract: "<link/spec>"
      anti_goals:
        - "Over-modeling softwareco domain on day 1"
    compass:
      drivers:
        - "Provide consistent domain meaning and safe autonomy"
      outcomes:
        - "Reduce domain drift; make invariants enforceable"
      tradeoffs:
        - decision: "Speed vs Compliance"
          chosen: "Compliance constraints are explicit; speed via automation within boundaries"
          because: "Avoid accidental harm"
    engine:
      invariants:
        - id: "SW-INV-TOPOLOGY-001"
          statement: "SoftwareCo uses owned/ and contrib/ lanes; avoid 'projects/' naming for new work."
          enforcement: "policy"
        - id: "<CO-INV-001>"
          statement: "<domain golden rule>"
          enforcement: "<test|db|policy>"
      lifecycle:
        - "<domain lifecycle>"
    fog:
      assumptions:
        - id: "<CO-A-001>"
          statement: "<assumption>"
          how_to_validate: "<validation>"
      risks:
        - id: "SW-R-001"
          statement: "Microservice sprawl increases edges and bugs"
          mitigation: "Prefer modular monolith unless needed"
      exceptions:
        - id: "CO-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Must record Exception immediately and Debt immediately"
      debt:
        - id: "<CO-D-001>"
          statement: "<debt>"
          payoff_plan: "<plan>"
