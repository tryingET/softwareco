name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run"
        required: true
        type: choice
        default: full
        options:
          - full
          - deep

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject symlinked ontology manifest
        run: |
          if [ -L ontology/manifest.yaml ]; then
            echo "error: ontology manifest may not be a symlink" >&2
            exit 1
          fi

      - name: Verify vendored ROCS receipt anchor
        run: |
          printf '%s  %s\n' \
            259e5264e9c3dc620981448a75efbad0d840d213898c9cacf87655b3980d80b7 \
            tools/rocs-cli/VENDORED_HASHES.json | sha256sum --check -

      - name: Run smoke lane
        run: bash ./scripts/ci/smoke.sh

  full:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'full' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize ontology owner when declared
        env:
          SOFTWARECO_ONTOLOGY_TOKEN: ${{ secrets.SOFTWARECO_ONTOLOGY_TOKEN }}
        run: |
          if [ -L ontology/manifest.yaml ]; then
            echo "error: ontology manifest may not be a symlink" >&2
            exit 1
          fi
          if [ ! -f ontology/manifest.yaml ]; then
            ./scripts/materialize-ontology.sh \
              --expected-oid b2e42daf61a889c08745b922056b627753f45a2c \
              --source https://github.com/tryingET/softwareco-ontology.git \
              --token-env SOFTWARECO_ONTOLOGY_TOKEN
          fi

      - name: Setup uv (full lane)
        uses: astral-sh/setup-uv@v5

      - name: Materialize exact strict core ontology dependency
        run: |
          mkdir -p "$HOME/ai-society/core"
          git clone --quiet --depth 1 --branch v0.3.0 \
            https://github.com/tryingET/core_ontology-kernel.git \
            "$HOME/ai-society/core/ontology-kernel"
          test "$(git -C "$HOME/ai-society/core/ontology-kernel" rev-parse HEAD)" = \
            a6d38f56dd9b91e0a03b96444385402aecf1b9b0

      - name: "Materialize pinned rocs-cli core (AK #5901)"
        run: |
          # tryingET/rocs-cli is public since 2026-09-30 (AK 6273), so no deploy key.
          # The pinned-core launcher runs $HOME/ai-society/core/rocs-cli, so it must
          # be this exact release.
          git clone -q --depth 1 --branch v0.4.6 https://github.com/tryingET/rocs-cli.git \
            "$HOME/ai-society/core/rocs-cli"
          test "$(git -C "$HOME/ai-society/core/rocs-cli" rev-parse HEAD)" = \
            bdb4ac4db29f6f87af884c27e1515acfd131c08d

      - name: Run full lane
        env:
          ROCS_OUTPUT_ROOT: governance/ontology-dist
          ROCS_AUTHORITY_AGGREGATE: "1"
        run: bash ./scripts/ci/full.sh

  deep:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'deep' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize ontology owner when declared
        env:
          SOFTWARECO_ONTOLOGY_TOKEN: ${{ secrets.SOFTWARECO_ONTOLOGY_TOKEN }}
        run: |
          if [ -L ontology/manifest.yaml ]; then
            echo "error: ontology manifest may not be a symlink" >&2
            exit 1
          fi
          if [ ! -f ontology/manifest.yaml ]; then
            ./scripts/materialize-ontology.sh \
              --expected-oid b2e42daf61a889c08745b922056b627753f45a2c \
              --source https://github.com/tryingET/softwareco-ontology.git \
              --token-env SOFTWARECO_ONTOLOGY_TOKEN
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Materialize exact strict core ontology dependency
        run: |
          mkdir -p "$HOME/ai-society/core"
          git clone --quiet --depth 1 --branch v0.3.0 \
            https://github.com/tryingET/core_ontology-kernel.git \
            "$HOME/ai-society/core/ontology-kernel"
          test "$(git -C "$HOME/ai-society/core/ontology-kernel" rev-parse HEAD)" = \
            a6d38f56dd9b91e0a03b96444385402aecf1b9b0

      - name: "Materialize pinned rocs-cli core (AK #5901)"
        run: |
          # tryingET/rocs-cli is public since 2026-09-30 (AK 6273), so no deploy key.
          # The pinned-core launcher runs $HOME/ai-society/core/rocs-cli, so it must
          # be this exact release.
          git clone -q --depth 1 --branch v0.4.6 https://github.com/tryingET/rocs-cli.git \
            "$HOME/ai-society/core/rocs-cli"
          test "$(git -C "$HOME/ai-society/core/rocs-cli" rev-parse HEAD)" = \
            bdb4ac4db29f6f87af884c27e1515acfd131c08d

      - name: Run deep lane
        env:
          ROCS_OUTPUT_ROOT: governance/ontology-dist
          ROCS_AUTHORITY_AGGREGATE: "1"
        run: bash ./scripts/ci/full.sh --deep
