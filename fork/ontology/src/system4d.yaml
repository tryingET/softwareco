# softwareco/fork in System4D terms.
# The SoftwareCo fork lane root: the policy and inventory surface for maintained forks and deliberate divergence repos; each fork below it is its own git repo.
# Written for the agents that work in and beside this repo: read it before changing what the repo does or how.
# README.md, AGENTS.md and docs/project/ hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "SoftwareCo fork lane root"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Lane-level policy in AGENTS.md: parent context injected into every fork repo below it"
          - "The rule for what belongs in fork/: upstream scope or governance no longer fits, long-lived divergence is intentional, and the work is no longer best modelled as upstream follow-up tickets"
          - "Inventory of the child fork repos (README.md) and routing of work into them"
          - "The lane's control-plane files: AGENTS.md, governance/, ontology/, policy/, scripts/, docs/ and diary/ (.gitignore tracks only these)"
        out_of_scope:
          - "Implementation work in the forks (pi-mono, the first child, holds the post-upstream DSPY line): it runs inside each child repo under its own AK task authority (governance/README.md)"
          - "Each fork's divergence strategy and upstream issue history: they belong in that repo's own AGENTS.md and docs/decisions"
          - "First-party delivery repos (owned/), platform and runbook repos (infra/), and upstream-coupled mirrors we still mainly contribute back to (contrib/)"
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it; the checked-in work-items mirror is retired under Decision 127"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
      constraints:
        - "Main-first: commit directly to main for normal work; GitHub PRs for releases or when the operator asks for one (AGENTS.md)"
        - "Keep AGENTS.md concise and lane-level, because every descendant fork prompt includes it"
        - "docs/_core/** is immutable; no secrets in git"
        - "The core ontology layer is pinned to the protected release <repo:core/ontology-kernel@v0.2.0> (commit 23222fc)"
        - "The lane root git repo has no remote configured"
      edges:
        - name: "Child fork repos"
          direction: "out"
          protocol: "file"
          system: "Fork repos under this directory (pi-mono, GLM-OCR, dspy-lm-auth and others), each with its own GitHub origin"
          contract: "AGENTS.md (parent context and fork-lane intent); .gitignore ('Track lane baseline only'; child repositories are ignored)"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this lane live in AK, not in markdown (governance/README.md)"
        - name: "core/ontology-kernel and softwareco/ontology"
          type: "build"
          note: "The core and company ontology layers, pinned in ontology/manifest.yaml as <repo:core/ontology-kernel@v0.2.0> and <repo:softwareco/ontology@main>"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which resolves ROCS_BIN, the workspace core/rocs-cli checkout, or rocs on PATH"
      anti_goals:
        - "Re-centralising child-repo execution in the lane root (next_session_prompt.md)"
        - "Copying upstream-specific issue history or a fork's divergence strategy into the lane AGENTS.md"
        - "A checked-in work-items projection (Decision 127)"
    compass:
      drivers:
        - "DSPY-related work tracked against badlogic/pi-mono is considered closed upstream locally; further work moves into a fork instead of more upstream requests (README.md Current motivation)"
      outcomes:
        - "Every fork repo records why it exists and which upstream boundary failed, in its own docs/decisions"
        - "The lane root stays a minimal policy and inventory surface while execution happens in the child repos (docs/project/mission.md)"
      tradeoffs:
        - decision: "How the lane root relates to its forks"
          chosen: "Separate git repos below a root that tracks only the lane control-plane files and holds policy and inventory"
          because: "After the first child repo existed, the root returned to policy and inventory (diary/2026-03-13--feat-first-fork-repo-bootstrap.md)"
        - decision: "How to repair the stale generated ROCS workspace-root default"
          chosen: "A one-file repair of scripts/ci/full.sh instead of a full template recopy"
          because: "A full recopy would overwrite intentional divergence (diary/2026-08-24--rocs-workspace-root-default-repair.md, AK 4961)"
    engine:
      triggers:
        - "A new fork repo enters the lane, or the lane policy changes"
      states: []
      invariants:
        - id: "FRK-INV-001"
          statement: "No change touches docs/_core/**"
          enforcement: "test: scripts/ci/smoke.sh rejects a diff against the base branch that touches docs/_core"
        - id: "FRK-INV-002"
          statement: "The ontology layers resolve and pass rocs build and validate; branch-ci and main-strict require strict workspace ref resolution, local-dev defaults to loose"
          enforcement: "test: scripts/ci/full.sh (ROCS_CI_PROFILE)"
        - id: "FRK-INV-003"
          statement: "Each fork repo records why the fork exists and what upstream boundary failed, in its own docs/decisions"
          enforcement: "policy: AGENTS.md Guardrails"
      lifecycle:
        - "Decide that a repo belongs in fork/ by the fork-lane intent in AGENTS.md"
        - "Create it as its own repo under this directory, with its fork rationale in its own docs/decisions"
        - "Record it in the README.md inventory and route its work to that repo's AK task authority"
    fog:
      assumptions: []
      risks:
        - id: "FRK-R-001"
          statement: "Text added to the lane AGENTS.md lands in every fork repo's prompt, so lane bloat or upstream-specific detail reaches repos it does not fit"
          mitigation: "Keep repo-specific divergence strategy in each fork's own AGENTS.md (AGENTS.md First-principles boundary)"
      exceptions:
        - id: "FRK-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "FRK-D-001"
          statement: "The README.md inventory lists only pi-mono, while GLM-OCR, dspy-lm-auth, human-atlas and vllm checkouts also sit in the lane; its Structure section still calls governance/ a work queue projection"
          payoff_plan: "None recorded; refresh the inventory under an AK task"
        - id: "FRK-D-002"
          statement: "docs/project purpose and vision are 'TBD', and policy/stack-lane.json is an empty file"
          payoff_plan: "None recorded"
        - id: "FRK-D-003"
          statement: "./scripts/rocs.sh does not set ROCS_WORKSPACE_ROOT; only scripts/ci/full.sh defaults it to ~/ai-society, so a bare ./scripts/rocs.sh validate --resolve-refs fails with 'local ref not available in workspace'"
          payoff_plan: "None recorded; run ./scripts/ci/full.sh or export ROCS_WORKSPACE_ROOT=$HOME/ai-society"
